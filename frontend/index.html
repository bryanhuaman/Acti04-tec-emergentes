<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Delivery G4 · Atención asistida</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view-container">Saltar al contenido</a>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <div class="app-shell">
      <button class="navigation-backdrop hidden" id="navigation-backdrop" aria-label="Cerrar menú de navegación" tabindex="-1"></button>
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <button class="icon-button menu-close" id="menu-close" aria-label="Cerrar menú">×</button>
        <div class="brand-lockup">
          <div class="brand-mark">DG</div>
          <div>
            <strong>Delivery G4</strong>
            <span>Atención asistida</span>
          </div>
        </div>

        <div class="workspace-switcher">
          <div class="workspace-icon">G4</div>
          <div class="workspace-meta">
            <span class="eyebrow">Espacio de trabajo</span>
            <strong>Operaciones</strong>
          </div>
          <button class="icon-button subtle" aria-label="Cambiar workspace" title="Cambiar workspace">⌄</button>
        </div>

        <nav class="nav-stack">
          <p class="nav-label">Atención</p>
          <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span><span>Resumen</span></button>
          <button class="nav-item" data-view="claims"><span class="nav-icon">▤</span><span>Bandeja de reclamos</span><span class="nav-count">8</span></button>
          <button class="nav-item" data-view="faq"><span class="nav-icon">?</span><span>Preguntas frecuentes</span></button>
          <button class="nav-item" data-view="orders"><span class="nav-icon">⌁</span><span>Consultar pedido</span></button>
          <p class="nav-label nav-label-spaced">Conocimiento</p>
          <button class="nav-item" data-view="sources"><span class="nav-icon">◈</span><span>Políticas y fuentes</span></button>
          <button class="nav-item" data-view="reports"><span class="nav-icon">◒</span><span>Evaluación</span></button>
          <p class="nav-label nav-label-spaced">Entrega</p>
          <button class="nav-item" data-view="sprints"><span class="nav-icon">⊞</span><span>Plan Scrum</span></button>
        </nav>

        <div class="sidebar-footer">
          <div class="team-mini">
            <div class="avatar avatar-joseph">JA</div>
            <div><strong>Joseph Alexander</strong><span>Product Owner</span></div>
            <span class="presence"></span>
          </div>
          <button class="nav-item settings-item" data-view="settings"><span class="nav-icon">◍</span><span>Configuración</span></button>
        </div>
      </aside>

      <main class="main-content" id="main-content">
        <header class="topbar">
          <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Abrir menú de navegación" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div class="breadcrumb"><span>Delivery G4</span><b>/</b><strong id="breadcrumb-current">Resumen</strong></div>
          <div class="topbar-actions">
            <label class="theme-control" for="theme-select"><span>Tema</span><select id="theme-select" aria-label="Tema de la interfaz"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></label>
            <button class="topbar-search" id="global-search-trigger" aria-label="Buscar"><span class="search-glyph">⌕</span><span>Buscar reclamos</span><kbd>⌘ K</kbd></button>
            <button class="icon-button" aria-label="Notificaciones" title="Notificaciones"><span class="notification-dot"></span>◌</button>
            <div class="topbar-user"><div class="avatar avatar-joseph">JA</div><span>Joseph</span><span class="chevron">⌄</span></div>
          </div>
        </header>

        <section class="view-container" id="view-container" tabindex="-1" aria-label="Contenido de la sección">
          <!-- Dynamic views are injected by app.js -->
        </section>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="modal-backdrop">
      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
    </div>

    <template id="claim-form-template">
      <div class="modal-header"><div><span class="eyebrow accent">Nuevo caso</span><h2 id="modal-title">Registrar un reclamo</h2><p>La información se clasificará para orientar la atención.</p></div><button class="close-button" data-close-modal aria-label="Cerrar">×</button></div>
      <form id="claim-form" class="form-grid">
        <label class="field full"><span>Nombre del cliente</span><input name="customer" required placeholder="Ej. Valeria Soto" /></label>
        <label class="field"><span>Número de pedido</span><input name="order" required placeholder="DG4-2026-0000" /></label>
        <label class="field"><span>Canal de contacto</span><select name="channel"><option>Chat</option><option>Correo</option><option>Web</option><option>WhatsApp</option></select></label>
        <label class="field full"><span>Describe el problema</span><textarea name="description" rows="5" required placeholder="Cuéntanos qué ocurrió con tu pedido..."></textarea><small>La descripción es necesaria para registrar el caso.</small></label>
        <div class="form-foot full"><span class="form-hint">Se guardará con estado <b>Nuevo</b>.</span><button type="submit" class="button primary">Registrar reclamo <span>→</span></button></div>
      </form>
    </template>

    <script src="app.js"></script>
  </body>
</html>
